<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project List | Raymundus Erik Chandra</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <div>
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 mb-8">
      <div class="max-w-5xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          <h1 class="text-xl font-bold tracking-wide">Daftar Proyek & Portofolio</h1>
        </div>
        <span class="bg-blue-800 text-xs text-blue-100 px-3 py-1 rounded-full font-semibold border border-blue-400">IT Internal</span>
      </div>
    </header>

    <!-- Banner Info -->
    <main class="max-w-5xl mx-auto px-4 mb-8">
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl p-6 shadow-lg mb-8">
        <h2 class="text-2xl font-bold mb-2">Direktori Aplikasi & Tools</h2>
        <p class="text-blue-100 text-sm md:text-base">Kumpulan sistem, tools otomasi, dan aplikasi web yang telah dibangun.</p>
      </div>

      <!-- Container Daftar Proyek -->
      <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Loading Indicator -->
        <div class="col-span-full text-center py-10 text-gray-500">
          <p>Memuat daftar proyek...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-gray-500 border-t border-gray-200 mt-12 bg-white">
    <p>© 2026 Raymundus Erik Chandra Yunanta. All rights reserved.</p>
  </footer>

  <!-- Link ke script.js -->
  <script src="script.js"></script>
</body>
</html>
